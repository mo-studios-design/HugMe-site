<!DOCTYPE html>
<html lang="zh-HK">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>HugMe 抱抱站</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>HugMe 抱抱站</h1>

    <p class="subtitle">
      有些情緒，<br>
      不一定能說給身邊的人聽。
    </p>

    <textarea
      id="message"
      placeholder="寫下今天讓你難過、委屈、焦慮，或無法說出口的事情……">
    </textarea>

    <button onclick="eatEmotion()">
      交給小怪獸
    </button>

    <div class="monster">
      👾
    </div>

    <div id="result" class="hidden">

      <p class="eat-text">
        小怪獸已經幫你吃掉這份情緒了。
      </p>

      <p class="hug-text">
        現在給你一個抱抱。
      </p>

      <img
        src="https://media.tenor.com/QNgsKJ0C5dAAAAAj/hug.gif">

      <p id="comfortText"></p>

      <button
        class="again-btn"
        onclick="writeAgain()">

        再寫一條

      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
