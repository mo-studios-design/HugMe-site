<!DOCTYPE html>
<html lang="zh-HK">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>HugMe 抱抱站</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="stars">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

  </div>

  <main class="app">

    <section class="hero">

      <h1>HugMe 抱抱站</h1>

      <p class="subtitle">

        有些情緒，<br>
        不一定能說給身邊的人聽。

      </p>

    </section>

    <section class="input-card">

      <textarea
        id="message"
        placeholder="寫下今天讓你難過、委屈、焦慮，或無法說出口的事情……"></textarea>

      <button onclick="eatEmotion()">

        交給小怪獸

      </button>

    </section>

    <section class="monster-area">

      <div id="paperNote"
           class="paper-note hidden">

        情緒小紙條

      </div>

      <img
        id="monster"
        class="monster-img"
        src="monster.png"
        alt="HugMe 小怪獸">

    </section>

    <section id="result"
             class="result-card hidden">

      <p class="eat-text">

        小怪獸已經幫你吃掉這份情緒了。

      </p>

      <p class="hug-text">

        現在給你一個抱抱。

      </p>

      <div class="hug-box">

        ♡

      </div>

      <p id="comfortText"></p>

      <button class="again-btn"
              onclick="writeAgain()">

        再寫一條

      </button>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
